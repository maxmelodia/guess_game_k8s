apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: guess-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: maxmelodia/guess-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_DB_HOST
              value: "postgres"
            - name: FLASK_DB_PORT
              value: "5432"
            - name: FLASK_DB_NAME
              value: "postgres"
            - name: FLASK_DB_USER
              value: "postgres"
            - name: FLASK_DB_PASSWORD
              value: "secretpass"
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']